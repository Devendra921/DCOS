server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect site root to the app base path
    location = / {
        return 302 /dcos/;
    }

    # SPA under /dcos/ (matches vite.config base)
    location /dcos/ {
        try_files $uri $uri/ /dcos/index.html;
    }
}
